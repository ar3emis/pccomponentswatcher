name: Publish price site

on:
  schedule:
    # Every six hours. Times are UTC.
    - cron: '20 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'SETUP.md'
      - 'data/**'

# Allow one publish at a time; a queued run picks up the newer prices anyway.
concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Cheap, and there is no point scraping for six minutes if the access
      # rule or the signature checks are broken.
      - name: Verify access rules and signature handling
        run: |
          node tools/test-tier-parity.js
          node tools/test-crypto.mjs

      - name: Install Chromium for the browser-only retailers
        run: npx playwright install --with-deps chromium

      - name: Scrape prices and build both payloads
        run: npm run export-web

      # These two gate the paywall. If either fails, nothing is published.
      - name: Verify no paid data leaks into the free payload
        run: npm run test:payload

      - name: Verify no payload sits in the public asset root
        run: npm run test:assets

      - name: Upload payloads to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: |
          npx wrangler kv key put data:free --path ../dist-data/data-free.json --binding DATA --remote
          npx wrangler kv key put data:full --path ../dist-data/data-full.json --binding DATA --remote

      - name: Deploy the Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: npx wrangler deploy

      # History lives in the repo so trend lines survive between runs.
      - name: Commit refreshed price history
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/history.json
          git diff --staged --quiet || git commit -m 'chore: refresh price history'
          git push
