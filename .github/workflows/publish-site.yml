name: Publish price site

on:
  schedule:
    # Every six hours. Times are UTC.
    - cron: '20 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'data/**'

# One publish at a time. A queued run picks up the newer prices anyway, so
# cancelling the in-flight one would only waste a completed scrape.
concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: write   # commits the refreshed price history
  pages: write      # publishes the built site
  id-token: write   # required by actions/deploy-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check the parsers still agree with their fixtures
        run: npm test

      # Several retailers serve a bot-check page to plain HTTP clients and only
      # render prices with JavaScript. Those are scraped in a real browser.
      - name: Install Chromium for the browser-only retailers
        run: npx playwright install --with-deps chromium

      - name: Scrape prices and build the site
        run: npm run export-web

      - name: Fail if the scrape produced nothing
        run: |
          count=$(node -e "process.stdout.write(String(require('./site/data.json').snapshot.listings.length))")
          echo "in-stock listings: $count"
          if [ "$count" -lt 50 ]; then
            echo "::error::Only $count listings — refusing to publish a near-empty site."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # History lives in the repo so the trend lines survive between runs.
      # The site is already deployed by this point, so a push that loses a race
      # with a commit landing mid-run must not fail the job: rebase and retry,
      # and if it still will not land, say so and move on.
      - name: Commit refreshed price history
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/history.json
          git diff --staged --quiet && { echo 'history unchanged'; exit 0; }
          git commit -m 'chore: refresh price history'
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto the newer main (attempt $attempt)"
            git pull --rebase --strategy-option=ours origin main || git rebase --abort
          done
          echo '::warning::Could not push the refreshed history; the next run will carry it.'
